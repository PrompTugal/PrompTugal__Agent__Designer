<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760"><style>.bg{fill:#f6f3ec}.i{fill:#121317}.n{fill:#595c64}.g{fill:#006600}.bx{fill:#fffdf8;stroke:#9d9580}.hs{stroke:#d9d2c1}.ch{fill:#fff;stroke:#121317}.sol{fill:#121317}text{font-family:"IBM Plex Mono",monospace}.t{font-family:Newsreader,Georgia,serif}</style><rect class="bg" width="640" height="760"/><rect x="28" y="22" width="96" height="8" class="g"/><text class="t i" x="28" y="60" font-size="24" font-weight="600" text-anchor="start">Status: layout sketch (example rows)</text><text class="n" x="28" y="82" font-size="11" font-weight="400" text-anchor="start">Phone (375 px) on the left, desktop notes on the right.</text><rect class="bx" x="28" y="100" width="300" height="620" rx="6"/><text class="t i" x="40" y="122" font-size="15" font-weight="700" text-anchor="start">Status of PrompTugal</text><text class="n" x="40" y="142" font-size="9" font-weight="400" text-anchor="start">Built 28 Nov 01:20 · agents read 01:00 · data 01:00</text><rect class="bx" x="38" y="160" width="280" height="118" style="fill:#fff;stroke:#121317;stroke-width:2"/><text class="i" x="48" y="178" font-size="10" font-weight="700" text-anchor="start">WAITS ON DINIS (4)</text><text class="i" x="48" y="198" font-size="9.5" font-weight="400" text-anchor="start">1  Keys: sign my enrolment · cl-6.security</text><line class="hs" x1="48" x2="308" y1="203" y2="203"/><text class="i" x="48" y="218" font-size="9.5" font-weight="400" text-anchor="start">2  Meter: share read or whole price</text><line class="hs" x1="48" x2="308" y1="223" y2="223"/><text class="i" x="48" y="238" font-size="9.5" font-weight="400" text-anchor="start">3  Gmail: read, send, which mailbox</text><line class="hs" x1="48" x2="308" y1="243" y2="243"/><text class="i" x="48" y="258" font-size="9.5" font-weight="400" text-anchor="start">4  /app/: what it is now · cl-6.conductor</text><line class="hs" x1="48" x2="308" y1="263" y2="263"/><text class="i" x="40" y="302" font-size="10" font-weight="700" text-anchor="start">AGENTS · 41 · 9 desks</text><rect class="ch" x="178" y="290" width="40" height="18" rx="9"/><text class="i" x="198" y="303" font-size="9" font-weight="400" text-anchor="middle">all</text><rect class="ch" x="224" y="290" width="92" height="18" rx="9" style="fill:#121317"/><text style="fill:#fff" x="270" y="303" font-size="9" font-weight="400" text-anchor="middle">only blocked</text><line class="sol" x1="38" x2="318" y1="320" y2="320"/><text class="i" x="40" y="336" font-size="10" font-weight="700" text-anchor="start">DESK: Newsroom (6)  · 4 working · 1 waiting</text><rect class="bx" x="38" y="346" width="280" height="52"/><text class="i" x="46" y="362" font-size="11" font-weight="700" text-anchor="start">cl-6.journalist</text><rect class="ch" x="240" y="351" width="70" height="16" rx="8"/><text class="i" x="275" y="363" font-size="8.5" font-weight="600" text-anchor="middle">WORKING</text><text class="n" x="46" y="380" font-size="9" font-weight="400" text-anchor="start">27 Nov 22:10 · 6 articles checked</text><text class="n" x="46" y="392" font-size="9" font-weight="400" text-anchor="start">next: ...  ·  blocked on: nothing</text><rect class="bx" x="38" y="404" width="280" height="52"/><text class="i" x="46" y="420" font-size="11" font-weight="700" text-anchor="start">cl-6.correspondent</text><rect class="ch" x="240" y="409" width="70" height="16" rx="8"/><text class="i" x="275" y="421" font-size="8.5" font-weight="600" text-anchor="middle">WAITING</text><text class="n" x="46" y="438" font-size="9" font-weight="400" text-anchor="start">27 Nov 16:25 · front page lead</text><text class="n" x="46" y="450" font-size="9" font-weight="400" text-anchor="start">next: ...  ·  blocked on: nothing</text><rect class="bx" x="38" y="462" width="280" height="52" style="stroke-width:2;stroke:#121317"/><text class="i" x="46" y="478" font-size="11" font-weight="700" text-anchor="start">cl-6.designer</text><rect class="ch" x="240" y="467" width="70" height="16" rx="8" style="fill:#121317"/><text style="fill:#fff" x="275" y="479" font-size="8.5" font-weight="600" text-anchor="middle">BLOCKED</text><text class="n" x="46" y="496" font-size="9" font-weight="400" text-anchor="start">27 Nov 19:24 · wake pass, S4 checked</text><text class="n" x="46" y="508" font-size="9" font-weight="400" text-anchor="start">blocked on: Dinis (key entry) ▸ tap for more</text><text class="i" x="40" y="536" font-size="10" font-weight="700" text-anchor="start">DESK: Places (21) ▸   DESK: Data (6) ▸   ...</text><line class="sol" x1="38" x2="318" y1="556" y2="556"/><text class="i" x="40" y="572" font-size="10" font-weight="700" text-anchor="start">DATA · 12 sets · 3 stale</text><rect class="bx" x="38" y="580" width="280" height="34"/><text class="i" x="46" y="595" font-size="10" font-weight="700" text-anchor="start">Weather (Open-Meteo)</text><rect class="ch" x="250" y="585" width="60" height="16" rx="8" style="fill:#121317"/><text style="fill:#fff" x="280" y="597" font-size="8.5" font-weight="600" text-anchor="middle">STALE</text><text class="n" x="46" y="608" font-size="9" font-weight="400" text-anchor="start">read 21 Nov 06:00 · cl-6.weather</text><text class="n" x="28" y="744" font-size="9.5" font-weight="400" text-anchor="start">Every name, state, count and date in the frame is an EXAMPLE, not a fact. The page reads real feeds.</text><text class="i" x="352" y="112" font-size="11" font-weight="700">DESKTOP (1024 px and up)</text><text class="i" x="352" y="138" font-size="10.5">• Waits on Dinis: full width, at the top.</text><text class="i" x="352" y="158" font-size="10.5">• Agents: desks in two columns, one table</text><text class="n" x="362" y="173" font-size="10.5">row per agent: name, state, last</text><text class="n" x="362" y="188" font-size="10.5">activity, next step, blocked on, home</text><text class="n" x="362" y="203" font-size="10.5">repo; columns sortable.</text><text class="i" x="352" y="223" font-size="10.5">• Data: a table, stale first, then fresh.</text><text class="i" x="352" y="243" font-size="10.5">• A left rail lists the desks as anchors,</text><text class="n" x="362" y="258" font-size="10.5">with the number of blocked agents beside</text><text class="n" x="362" y="273" font-size="10.5">each.</text><text class="i" x="352" y="299" font-size="11" font-weight="700">RULES (both sizes)</text><text class="i" x="352" y="325" font-size="10.5">• State is a word in a chip (working,</text><text class="n" x="362" y="340" font-size="10.5">waiting, blocked, idle, archived), never</text><text class="n" x="362" y="355" font-size="10.5">colour alone.</text><text class="i" x="352" y="375" font-size="10.5">• Blocked rows have a heavy border and</text><text class="n" x="362" y="390" font-size="10.5">come first in their desk. Below 768 px</text><text class="n" x="362" y="405" font-size="10.5">each desk is a closed details that opens</text><text class="n" x="362" y="420" font-size="10.5">on its blocked rows.</text><text class="i" x="352" y="440" font-size="10.5">• Every date is absolute with its hour</text><text class="n" x="362" y="455" font-size="10.5">(UTC); no relative times.</text><text class="i" x="352" y="475" font-size="10.5">• The page says when it was built and when</text><text class="n" x="362" y="490" font-size="10.5">each feed was read.</text><text class="i" x="352" y="510" font-size="10.5">• Stale: older than 13 hours for hourly</text><text class="n" x="362" y="525" font-size="10.5">data (Dinis, 19 Nov); the threshold is</text><text class="n" x="362" y="540" font-size="10.5">shown on the page.</text><text class="i" x="352" y="560" font-size="10.5">• Phone: no sideways scroll; names wrap.</text><text class="i" x="352" y="580" font-size="10.5">• Existing site classes and tokens; no new</text><text class="n" x="362" y="595" font-size="10.5">colour.</text></svg>